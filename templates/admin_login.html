<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Astraflint Technology</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f5f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 320px;
            max-width: calc(100% - 60px);
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px #00000015;
        }

        h2 {
            text-align: center;
            color: #26352c;
        }

        p {
            text-align: center;
            color: #666;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #354d3b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #26352c;
        }

        .error {
            color: #c62828;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h2>Admin Login</h2>
        <p>Astraflint Technology</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="text" name="username"
                   placeholder="Admin Username" required>

            <input type="password" name="password"
                   placeholder="Admin Password" required>
            
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
