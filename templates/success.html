
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success | Astraflint Technology</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .success-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080b18;
            padding: 20px;
        }

        .success-card {
            text-align: center;
            max-width: 550px;
            padding: 50px 35px;
            border: 1px solid #a78bfa;
            border-radius: 18px;
            background: linear-gradient(145deg, #151a35, #29244a);
            box-shadow: 0 0 30px rgba(167, 139, 250, 0.2);
        }

        .success-icon {
            font-size: 60px;
            color: #a78bfa;
            margin-bottom: 20px;
        }

        .success-card h1 {
            color: #c4b5fd;
            margin-bottom: 18px;
        }

        .success-card p {
            color: white;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .success-btn {
            display: inline-block;
            padding: 13px 25px;
            background: #a78bfa;
            color: #11172b;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .success-btn:hover {
            background: #c4b5fd;
        }
    </style>
</head>

<body>

<div class="success-page">
    <div class="success-card">

        <div class="success-icon">✓</div>

        <h1>Thank You!</h1>

        <p>
            Your enquiry has been submitted successfully.
            Our team will contact you soon.
        </p>

        <a href="{{ url_for('contact') }}" class="success-btn">
            Back to Contact Page
        </a>

    </div>
</div>

</body>
</html>
