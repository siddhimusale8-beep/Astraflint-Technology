<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Application Submitted | Astraflint Technology</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #080b18;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .success-box {
            background: #11172b;
            border: 1px solid #343052;
            border-radius: 15px;
            padding: 45px 35px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 35px rgba(0,0,0,0.3);
        }

        .icon {
            width: 75px;
            height: 75px;
            background: #263c35;
            color: #63e6a3;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 25px;
        }

        h1 {
            color: #c5a5ff;
            font-size: 27px;
            margin-bottom: 15px;
        }

        p {
            color: #b5b8c9;
            line-height: 1.7;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .back-btn {
            display: inline-block;
            padding: 13px 25px;
            background: linear-gradient(90deg, #7650d8, #a16bea);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .back-btn:hover {
            opacity: 0.9;
        }

        @media(max-width: 500px) {
            .success-box {
                padding: 30px 20px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="success-box">

        <div class="icon">✓</div>

        <h1>Application Submitted!</h1>

        <p>
            Thank you for applying to Astraflint Technology.
            Your internship application has been submitted successfully.
            Our team will contact you soon.
        </p>

        <a href="{{ url_for('internships') }}" class="back-btn">
            Back to Internships
        </a>

    </div>

</body>
</html>
